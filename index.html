<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(to right, #141e30, #243b55);
            color: white;
            text-align: center;
        }

        header {
            padding: 20px;
            background: rgba(0,0,0,0.5);
        }

        h1 {
            margin: 0;
        }

        .container {
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            margin: 20px;
            width: 250px;
            border-radius: 10px;
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        button {
            padding: 10px;
            border: none;
            background: orange;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
        }
    </style>
</head>
<body>

<header>
    <h1>👋 Welcome to my website</h1>
    <p>I am Younsse - Game Developer 🎮</p>
</header>

<div class="container">

    <h2>🎮 My Games</h2>

    <div class="card">
        <h3>🚧 Coming Soon...</h3>
        <p>My games will be available here</p>
    </div>

</div>

</body>
</html>
